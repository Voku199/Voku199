<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="40" viewBox="0 0 1000 40" role="img"><title>selected projects</title><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace}
.fg{fill:#1f2328} .muted{fill:#59636e} .accent{fill:#e5482a}
.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.draw{animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.up{opacity:1}.draw{stroke-dashoffset:0}}
</style>
    <text class="mono accent" x="0" y="27" font-size="15">01</text>
    <text class="sans fg" x="36" y="28" font-size="22" font-weight="600">selected projects</text>
    <line class="draw" x1="274" y1="21" x2="1000" y2="21" stroke="#d0d7de" stroke-width="1"
          stroke-dasharray="726" stroke-dashoffset="726"/></svg>