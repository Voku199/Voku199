<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img"><title>66 projects &amp; experiments, 330k+ lines of code, 6 languages I ship in, 2 laser-game arenas on my code</title><style>
